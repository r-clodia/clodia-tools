# TEST FIXTURE since clodia-platform#526: the gateway's former builtin
# declaration, kept as the parity reference of the first-party packs
# (`server/connectors/first_party_fixture.py`). The gateway never loads it.
#
# Telegram, come il gateway lo implementa oggi (clodia-platform#518).
# La migrazione #522 sposta questo file in comms-pack e lo cancella da qui.
# Nel frattempo l'interruttore per istanza lo toglie dal SERVIZIO senza
# cancellarlo: con `connectors: {telegram: pack}` in `profile.yaml` questo
# documento non entra nel registry (`builtin.manifests`) e la dichiarazione
# identica del pack prende il suo posto — una istanza alla volta, e reversibile
# senza un rollback del codice.
#
# Nessun `seal_cap`: il tetto SEAL di un binding non è un campo del manifest
# (decisione dell'epic #527). `_CHANNEL_SEAL_CAP` resta dov'è finché la
# migrazione non porta via il connettore che cappa — scostamento dichiarato
# nella PR di #518.
name: gateway-telegram
connectors:
  - id: telegram
    manifest_version: 1
    namespace: telegram
    label: Telegram
    schemes:
      # Le due forme di `tg:`, e non ce n'è una terza: la distinzione fra un
      # gruppo e una persona la porta la FORMA, non un parametro a parte.
      # In uscita una voce che non ha una di queste due forme sarebbe approvata
      # e inefficace; in ingresso un wildcard spegnerebbe il taint su tutto
      # Telegram.
      - scheme: tg
        direction: both
        label: Chat Telegram
        danger: 'una chat su Telegram, cioè su un''infrastruttura non tua.'
        forms:
          - label: gruppo
            pattern: '-?\d+'
            example: '-1001234567890'
          - label: persona
            pattern: '@[A-Za-z0-9_]{5,32}'
            example: '@dadabit'
    verbs:
      - verb: telegram.send
        direction: egress
        scheme: tg
        arg: chat_id
        dtype: telegram
      - verb: telegram.send_file
        direction: egress
        scheme: tg
        arg: chat_id
        dtype: telegram
    # Il bottone del topic: autorizza la chat in ENTRAMBE le direzioni e crea
    # il binding vero (`binding: channel`). Sono due passi e vanno insieme —
    # senza il secondo il messaggero non riporta niente anche con la whitelist
    # già scritta, ed è il sintomo che ha fatto nascere la rotta `telegram-link`.
    topic_actions:
      - id: telegram-link
        label: Collega una chat Telegram
        binding: channel
        fields:
          - name: chat
            label: Chat id o @handle
            placeholder: '-1001234567890'
        adds:
          ingress:
            - 'tg:{chat}'
          egress:
            - 'tg:{chat}'
    providers:
      # Il bot dedicato. La credenziale la DEPOSITA ancora `telegram_connect`
      # (`_LEGACY_CONNECT`), che prima di scrivere valida il token con getMe e
      # memorizza l'@username: dichiararla qui serve alla pagina per disegnare
      # il form, non a sostituire quella validazione.
      - id: bot
        label: Bot Telegram
        credential:
          kind: form
          vault_entry: telegram_bot_token
          fields:
            - name: token
              label: Token del bot (@BotFather)
              secret: true
    tools_card:
      icon: telegram
      setup_label: Collega un bot
      status_verb: telegram.status
      blurb: >-
        Gli agenti inviano/ricevono messaggi (tool telegram.*) con lease
        per-chat. Crea un bot dedicato con @BotFather e incolla il token.
      scope: api.telegram.org/bot
    # Chat in arrivo: chi scrive nel gruppo non è controllato, e una risposta
    # mescola più autori.
    taint:
      - telegram.inbox
      - telegram.receive
      - telegram.pull
